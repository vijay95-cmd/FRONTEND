<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Typing Game</title>
<link rel="stylesheet" href="/HTML/project/game.css">
<style>
  body {
    font-family: Arial, sans-serif;
    background: #812121;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
  } 
  h1 {
    margin-bottom: 100px;
  }
  #word {
    font-size: 2rem;
    margin: 20px 0;
  }
  #input {
    font-size: 1.5rem;
    padding: 10px;
    width: 300px;
  }
  #score {
    margin-top: 20px;
    font-size: 1.2rem;
  }
  #timer {
    margin-top: 10px;
    font-size: 1.2rem;
  }
  button {
    margin-top: 20px;
    padding: 10px 20px;
    font-size: 1rem;
  }
</style>
</head>
<body>

<h1>Typing Game</h1>
<div id="word">Loading...</div>
<input type="text" id="input" placeholder="Type the word here" autofocus />
<div id="score">Score: 0</div>
<div id="timer">Time: 60s</div>
<button id="restart">Restart Game</button>

<script>
const words = ["apple", "banana", "cherry", "dragonfruit", "elephant", "frog", "guitar", "honey", "ice", "jungle"];
let score = 0;
let time = 60;
let currentWord = '';

const wordDisplay = document.getElementById('word');
const input = document.getElementById('input');
const scoreDisplay = document.getElementById('score');
const timerDisplay = document.getElementById('timer');
const restartBtn = document.getElementById('restart');

function pickWord() {
  currentWord = words[Math.floor(Math.random() * words.length)];
  wordDisplay.textContent = currentWord;
}

function updateScore() {
  scoreDisplay.textContent = `Score: ${score}`;
}

function updateTimer() {
  timerDisplay.textContent = `Time: ${time}s`;
  if (time <= 0) {
    clearInterval(timerInterval);
    input.disabled = true;
    wordDisplay.textContent = "Game Over!";
  }
}

input.addEventListener('input', () => {
  if (input.value.trim() === currentWord) {
    score++;
    updateScore();
    input.value = '';
    pickWord();
  }
});

restartBtn.addEventListener('click', () => {
  score = 0;
  time = 60;
  input.disabled = false;
  input.value = '';
  updateScore();
  updateTimer();
  pickWord();
  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    time--;
    updateTimer();
  }, 1000);
});

// Start game
pickWord();
updateScore();
updateTimer();
let timerInterval = setInterval(() => {
  time--;
  updateTimer();
}, 1000);
</script>

</body>
</html>
